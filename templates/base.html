<!DOCTYPE html>
<html>
<head>
    <title>ЛокоТех-Сервис</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <!-- НАВИГАЦИЯ -->
        <ul class="nav nav-tabs mb-4">
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Главная</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/about/' %}active{% endif %}" href="/about/">О компании</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/contacts/' %}active{% endif %}" href="/contacts/">Контакты</a>
            </li>
        </ul>

        <h1 class="text-danger">ЛокоТех-Сервис</h1>
        <hr>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
