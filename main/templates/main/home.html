{% extends 'base.html' %}

{% block content %}
<h2>Заявка на ремонт</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label>Ваше имя</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Телефон</label>
        <input type="text" name="phone" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Описание проблемы</label>
        <textarea name="problem" class="form-control" rows="3" required></textarea>
    </div>
    <button type="submit" class="btn btn-danger">Отправить заявку</button>
</form>
{% endblock %}
